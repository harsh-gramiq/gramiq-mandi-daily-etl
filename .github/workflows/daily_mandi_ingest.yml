name: 🌾 GramIQ MandiBhav — Daily National ETL & Teams Sync

on:
  schedule:
    # Runs Monday through Saturday at 13:30 UTC (7:00 PM IST)
    - cron: '30 13 * * 1-6'
    # Optional second sync at 18:30 UTC (12:00 AM IST night closing)
    - cron: '30 18 * * 1-6'
  workflow_dispatch:
    inputs:
      trade_date:
        description: 'Trade date to ingest (YYYY-MM-DD, defaults to today)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run mode (extract and generate Teams card without database write)'
        type: boolean
        required: false
        default: false

jobs:
  ingest_mandi_rates:
    name: ⚡ AGMARKNET 2.0 Ingestion & Teams Card Dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Ingestion Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Daily Ingestion & Dispatch Adaptive Card
        env:
          # Production PostgreSQL Credentials
          PRODUCTION_DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          PRODUCTION_DB_PORT: ${{ secrets.PRODUCTION_DB_PORT }}
          PRODUCTION_DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
          PRODUCTION_DB_USERNAME: ${{ secrets.PRODUCTION_DB_USERNAME }}
          PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          # Fallback URI
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # Microsoft Teams Adaptive Card Webhook
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          CMD_ARGS="--print-card"
          if [ -n "${{ github.event.inputs.trade_date }}" ]; then
            CMD_ARGS="$CMD_ARGS --date ${{ github.event.inputs.trade_date }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            CMD_ARGS="$CMD_ARGS --dry-run"
          fi
          python main.py $CMD_ARGS
