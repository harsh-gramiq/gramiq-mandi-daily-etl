name: 🌾 Daily National Mandi Ingestion & Teams Sync

on:
  schedule:
    # Primary Sync: Monday through Saturday at 13:30 UTC (7:00 PM IST) — Peak national closing
    - cron: '30 13 * * 1-6'
    # Night Reconciliation: Monday through Saturday at 18:30 UTC (12:00 AM IST) — Complete reconciliation
    - cron: '30 18 * * 1-6'
  workflow_dispatch:
    inputs:
      trade_date:
        description: 'Trade date to ingest (YYYY-MM-DD, defaults to today)'
        required: false
        default: ''
      lookback_days:
        description: 'Trailing lookback window in days (default: 7)'
        required: false
        default: '7'
      workers:
        description: 'Number of parallel worker threads (default: 24)'
        required: false
        default: '24'
      dry_run:
        description: 'Dry run mode (extract and calculate without database write)'
        type: boolean
        required: false
        default: false

concurrency:
  group: daily-mandi-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest_mandi_rates:
    name: ⚡ AGMARKNET 2.0 Ingestion & Teams Card Dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Ingestion Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Daily Ingestion & Dispatch Adaptive Card
        env:
          # Production PostgreSQL Credentials
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRODUCTION_DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
          PRODUCTION_DB_PORT: ${{ secrets.PRODUCTION_DB_PORT }}
          PRODUCTION_DB_NAME: ${{ secrets.PRODUCTION_DB_NAME }}
          PRODUCTION_DB_USERNAME: ${{ secrets.PRODUCTION_DB_USERNAME }}
          PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
          # Microsoft Teams Adaptive Card Webhook
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          # Google Gemini AI Key
          GEMINI_API_KEY_OG: ${{ secrets.GEMINI_API_KEY_OG }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MANDI_RUN_MODE: ${{ github.event.schedule == '30 13 * * 1-6' && 'preliminary' || 'final' }}
        run: |
          CMD_ARGS="--print-card"
          if [ -n "${{ github.event.inputs.trade_date }}" ]; then
            CMD_ARGS="$CMD_ARGS --date ${{ github.event.inputs.trade_date }}"
          fi
          if [ -n "${{ github.event.inputs.lookback_days }}" ]; then
            CMD_ARGS="$CMD_ARGS --lookback-days ${{ github.event.inputs.lookback_days }}"
          else
            CMD_ARGS="$CMD_ARGS --lookback-days 7"
          fi
          if [ -n "${{ github.event.inputs.workers }}" ]; then
            CMD_ARGS="$CMD_ARGS --workers ${{ github.event.inputs.workers }}"
          else
            CMD_ARGS="$CMD_ARGS --workers 24"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            CMD_ARGS="$CMD_ARGS --dry-run"
          fi
          python main.py $CMD_ARGS
