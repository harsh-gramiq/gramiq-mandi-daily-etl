name: Daily AGMARKNET Mandi Ingestion

on:
  schedule:
    # Runs Monday through Saturday at 13:30 UTC (7:00 PM IST)
    - cron: '30 13 * * 1-6'
  workflow_dispatch:
    inputs:
      trade_date:
        description: 'Trade date to backfill (YYYY-MM-DD, defaults to today)'
        required: false
        default: ''

jobs:
  ingest_mandi_rates:
    name: Extract & Ingest AGMARKNET Rates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Ingestion Engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          if [ -n "${{ github.event.inputs.trade_date }}" ]; then
            python main.py --date "${{ github.event.inputs.trade_date }}"
          else
            python main.py
          fi
